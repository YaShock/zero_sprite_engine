<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1032 424" width="1032" height="424" role="img" aria-label="One frame: on the CPU, update, offscreen images, batching, the draw list and submit_draws. submit_draws uploads all instance records once into the Instances uniform buffer, then issues one instanced draw per call. On the GPU the vertex shader reads each record and the look's fragment shader reads its parameters from the same buffer.">
<style>
  .bg { fill: #f3f4f1; }
  .box { fill: #ffffff; stroke: #cdd2d4; stroke-width: 1.2; }
  .box-gpu { fill: #ffffff; stroke: #2c5a84; stroke-width: 1.2; }
  .box-hot { fill: #f6e2cf; stroke: #b55309; stroke-width: 1.4; }
  .lane-cpu { fill: #e7e9e3; opacity: 0.55; }
  .lane-gpu { fill: #dce8f2; }
  .t-title { font-family: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 600; font-size: 15px; fill: #1c2229; }
  .t-sub { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #5a636e; }
  .t-code { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1c2229; }
  .t-code-hot { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #b55309; font-weight: 500; }
  .t-label { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #5a636e; }
  .t-label-hot { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #b55309; font-weight: 500; }
  .t-lane { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; fill: #5a636e; }
  .t-lane-gpu { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; fill: #2c5a84; }
  .t-cell { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: #1c2229; }
  .t-idx, .t-idx text { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10px; fill: #5a636e; }
  .ln { stroke: #5a636e; stroke-width: 1.3; fill: none; }
  .ln-hot { stroke: #b55309; stroke-width: 1.6; fill: none; }
  .ln-gpu { stroke: #2c5a84; stroke-width: 1.4; fill: none; }
  .ln-dash { stroke-dasharray: 5 4; }
  .ah { fill: #5a636e; }
  .ah-hot { fill: #b55309; }
  .ah-gpu { fill: #2c5a84; }
  .cell-head { fill: #e7e9e3; stroke: #cdd2d4; }
  .cell-param { fill: #f6e2cf; stroke: #b55309; stroke-width: 0.8; }
  .cell-pad { fill: none; stroke: #cdd2d4; stroke-dasharray: 3 3; }
  .node { fill: #ffffff; stroke: #cdd2d4; stroke-width: 1.2; }
  .node-param { fill: #f6e2cf; stroke: #b55309; stroke-width: 1.3; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #14181d; }
    .box { fill: #1b2027; stroke: #353c45; stroke-width: 1.2; }
    .box-gpu { fill: #1b2027; stroke: #8fbbe3; stroke-width: 1.2; }
    .box-hot { fill: #3a2a1c; stroke: #f0943f; stroke-width: 1.4; }
    .lane-cpu { fill: #212730; opacity: 0.55; }
    .lane-gpu { fill: #182a3a; }
    .t-title { font-family: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 600; font-size: 15px; fill: #e3e6e9; }
    .t-sub { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #9aa3ad; }
    .t-code { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #e3e6e9; }
    .t-code-hot { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: #f0943f; font-weight: 500; }
    .t-label { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #9aa3ad; }
    .t-label-hot { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #f0943f; font-weight: 500; }
    .t-lane { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; fill: #9aa3ad; }
    .t-lane-gpu { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; fill: #8fbbe3; }
    .t-cell { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; fill: #e3e6e9; }
    .t-idx, .t-idx text { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 10px; fill: #9aa3ad; }
    .ln { stroke: #9aa3ad; stroke-width: 1.3; fill: none; }
    .ln-hot { stroke: #f0943f; stroke-width: 1.6; fill: none; }
    .ln-gpu { stroke: #8fbbe3; stroke-width: 1.4; fill: none; }
    .ah { fill: #9aa3ad; }
    .ah-hot { fill: #f0943f; }
    .ah-gpu { fill: #8fbbe3; }
    .cell-head { fill: #212730; stroke: #353c45; }
    .cell-param { fill: #3a2a1c; stroke: #f0943f; stroke-width: 0.8; }
    .cell-pad { fill: none; stroke: #353c45; stroke-dasharray: 3 3; }
    .node { fill: #1b2027; stroke: #353c45; stroke-width: 1.2; }
    .node-param { fill: #3a2a1c; stroke: #f0943f; stroke-width: 1.3; }
  }
</style>
<rect class="bg" x="-16" y="-16" width="1032" height="424" rx="12"/>
<g>
  <defs>
    <marker id="f3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker>
    <marker id="f3-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah-hot"/></marker>
    <marker id="f3-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah-gpu"/></marker>
  </defs>
  <rect class="lane-cpu" x="0" y="0" width="1000" height="172" rx="10"/>
  <text class="t-lane" x="20" y="24">CPU · ENGINE.RUN</text>
  <rect class="lane-gpu" x="0" y="222" width="1000" height="170" rx="10"/>
  <text class="t-lane-gpu" x="20" y="248">GPU</text>

  <rect class="box" x="20" y="40" width="160" height="100" rx="8"/>
  <text class="t-title" x="34" y="64">update</text>
  <text class="t-sub" x="34" y="86">scene time += dt</text>
  <text class="t-code" x="34" y="104">on_update(dt)</text>
  <text class="t-sub" x="34" y="122">set_param → params</text>

  <rect class="box" x="210" y="40" width="160" height="100" rx="8"/>
  <text class="t-title" x="224" y="64">offscreen</text>
  <text class="t-sub" x="224" y="86">cached looks,</text>
  <text class="t-sub" x="224" y="104">buffer and blurred</text>
  <text class="t-sub" x="224" y="122">layer images</text>

  <rect class="box" x="400" y="40" width="160" height="100" rx="8"/>
  <text class="t-title" x="414" y="64">batch</text>
  <text class="t-sub" x="414" y="86">join the newest group</text>
  <text class="t-sub" x="414" y="104">of its shader + blend,</text>
  <text class="t-sub" x="414" y="122">unless a quad overlaps</text>

  <rect class="box" x="590" y="40" width="160" height="100" rx="8"/>
  <text class="t-title" x="604" y="64">DrawList</text>
  <text class="t-sub" x="604" y="86">records: vec4s per</text>
  <text class="t-sub" x="604" y="104">instance; steps: draw</text>
  <text class="t-sub" x="604" y="122">calls, raylib draws</text>

  <rect class="box" x="780" y="40" width="200" height="100" rx="8"/>
  <text class="t-title" x="794" y="64">submit_draws</text>
  <text class="t-sub" x="794" y="86">per call: pick the variant,</text>
  <text class="t-sub" x="794" y="104">bind its records, set</text>
  <text class="t-sub" x="794" y="122">time, px, lights, textures</text>

  <line class="ln" x1="180" y1="90" x2="206" y2="90" marker-end="url(#f3-a)"/>
  <line class="ln" x1="370" y1="90" x2="396" y2="90" marker-end="url(#f3-a)"/>
  <line class="ln" x1="560" y1="90" x2="586" y2="90" marker-end="url(#f3-a)"/>
  <line class="ln" x1="750" y1="90" x2="776" y2="90" marker-end="url(#f3-a)"/>

  <!-- CPU to GPU -->
  <polyline class="ln-hot" points="820,140 820,158 435,158 435,258" marker-end="url(#f3-h)"/>
  <text class="t-label-hot" x="628" y="153" text-anchor="middle">① upload every record, once per list</text>
  <polyline class="ln-hot" points="930,140 930,196 665,196 665,258" marker-end="url(#f3-h)"/>
  <text class="t-label-hot" x="797" y="214" text-anchor="middle">② glDrawArraysInstanced, once per call</text>

  <!-- GPU side -->
  <text class="t-label" x="20" y="282">Each call runs one program:</text>
  <text class="t-label" x="20" y="300">the single variant when it draws</text>
  <text class="t-label" x="20" y="318">one instance, the batched variant</text>
  <text class="t-label" x="20" y="336">when it draws several (section 4).</text>

  <rect class="box-gpu" x="360" y="262" width="150" height="80" rx="8"/>
  <text class="t-title" x="374" y="286">Instances block</text>
  <text class="t-sub" x="374" y="306">uniform buffer, 64 KB</text>
  <text class="t-sub" x="374" y="324">window per call</text>

  <rect class="box-gpu" x="590" y="262" width="150" height="80" rx="8"/>
  <text class="t-title" x="604" y="286">vertex.glsl</text>
  <text class="t-sub" x="604" y="306">one quad per</text>
  <text class="t-sub" x="604" y="324">instance</text>

  <rect class="box-gpu" x="810" y="262" width="170" height="80" rx="8"/>
  <text class="t-title" x="824" y="286">look shader</text>
  <text class="t-sub" x="824" y="306">runs per pixel,</text>
  <text class="t-sub" x="824" y="324">reads its slots: u_p(i)</text>

  <line class="ln-gpu" x1="510" y1="302" x2="586" y2="302" marker-end="url(#f3-g)"/>
  <text class="t-label" x="548" y="294" text-anchor="middle">rows 0–2</text>
  <line class="ln-gpu" x1="740" y1="302" x2="806" y2="302" marker-end="url(#f3-g)"/>
  <text class="t-label" x="775" y="294" text-anchor="middle">v_params</text>
  <polyline class="ln-gpu ln-dash" points="435,342 435,374 895,374 895,346" marker-end="url(#f3-g)"/>
  <text class="t-label" x="672" y="368" text-anchor="middle">parameter reads, same buffer</text>
        </g>
</svg>
